<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0a09">
<title>Ashley</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600&display=swap">
<style>
  :root{
    --night:#0b0a09;
    --ivory:#f3ede4;
    --ivory-soft:rgba(243,237,228,.62);
    --ivory-faint:rgba(243,237,228,.38);
    --gold:#c9a25a;
    --gold-light:#f3dfae;
    --serif:"Instrument Serif",ui-serif,Georgia,"Times New Roman",serif;
    --sans:"Manrope",ui-sans-serif,-apple-system,"Segoe UI",system-ui,sans-serif;
    --ease:cubic-bezier(.2,.7,.1,1);
    --gutter:max(20px,env(safe-area-inset-left,0px));
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;background:var(--night);overflow:hidden}
  body{color:var(--ivory);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  img,video{display:block;max-width:100%}
  button{font:inherit;color:inherit;cursor:pointer}
  ::selection{background:var(--gold);color:var(--night)}
  .eyebrow{font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.32em;text-transform:uppercase}

  /* ---------------- sky (shared by every scene) ---------------- */
  #sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
  .glow{position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(55% 45% at 50% 50%,rgba(201,162,90,.10),rgba(201,162,90,0) 70%)}

  /* ---------------- 1 · the moon ---------------- */
  #gate{position:fixed;inset:0;z-index:100;display:grid;place-items:center;overflow:hidden;
    background:radial-gradient(60% 50% at 50% 50%,#15130f 0%,var(--night) 70%);
    transition:opacity 1.4s ease .5s,visibility 1.4s ease .5s}
  #gate.done{opacity:0;visibility:hidden;pointer-events:none}
  .moon-btn{position:relative;border:0;padding:0;background:none;width:min(42vw,220px);aspect-ratio:1;border-radius:50%;
    opacity:0;animation:moonIn 2.4s var(--ease) .2s forwards}
  .moon-btn:focus-visible{outline:1px solid rgba(243,237,228,.5);outline-offset:18px}
  .moon-float{position:absolute;inset:0;animation:float 7s ease-in-out infinite}
  .moon-halo{position:absolute;inset:-70%;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle,rgba(243,237,228,.20) 0%,rgba(243,237,228,.07) 28%,rgba(243,237,228,0) 60%);
    animation:halo 5s ease-in-out infinite}
  .moon{position:absolute;inset:0;border-radius:50%;overflow:hidden;
    box-shadow:0 0 60px 8px rgba(243,237,228,.16),0 0 160px 40px rgba(243,237,228,.07);
    transition:transform 1.6s var(--ease),filter 1.6s ease,opacity 1.4s ease}
  .moon svg{display:block;width:100%;height:100%}
  @keyframes moonIn{from{opacity:0;transform:translateY(24px) scale(.94)}to{opacity:1;transform:none}}
  @keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-14px) rotate(2deg)}}
  @keyframes halo{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.1);opacity:1}}
  #gate.done .moon{transform:scale(1.6);filter:brightness(1.6) blur(2px);opacity:0}
  #gate.done .moon-halo{opacity:0;transition:opacity .8s ease}

  /* ---------------- the star (used in the orbit and in the question) ---------------- */
  .star{position:relative;display:grid;place-items:center}
  .star .aura{position:absolute;inset:-75%;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle,rgba(255,240,205,.42) 0%,rgba(243,223,174,.16) 24%,rgba(201,162,90,.05) 46%,rgba(201,162,90,0) 66%);
    animation:halo 4.5s ease-in-out infinite}
  .star .pulse{position:absolute;inset:6%;border-radius:50%;border:1px solid rgba(243,223,174,.35);animation:pulse 4.5s ease-out infinite;pointer-events:none}
  .star .pulse.p2{animation-delay:2.25s}
  @keyframes pulse{from{transform:scale(.7);opacity:.9}to{transform:scale(2.1);opacity:0}}
  .star .flare{position:absolute;left:50%;top:50%;width:420%;height:1px;transform:translate(-50%,-50%);pointer-events:none;
    background:linear-gradient(90deg,rgba(243,223,174,0),rgba(255,246,224,.55) 50%,rgba(243,223,174,0))}
  .star .flare.v{width:1px;height:300%;background:linear-gradient(180deg,rgba(243,223,174,0),rgba(255,246,224,.4) 50%,rgba(243,223,174,0))}
  .star svg{position:relative;width:100%;height:100%;overflow:visible;
    filter:drop-shadow(0 0 14px rgba(255,240,205,.95)) drop-shadow(0 0 44px rgba(232,190,110,.6));animation:turn 80s linear infinite}
  @keyframes turn{to{transform:rotate(360deg)}}

  /* ---------------- 2 · the orbit ---------------- */
  #orbit{position:fixed;inset:0;z-index:2;overflow:hidden;transition:opacity 1.2s ease}
  #orbit.gone{opacity:0;pointer-events:none}
  .card{position:absolute;left:0;top:0;padding:0;border:0;background:#1a1714;border-radius:6px;overflow:hidden;cursor:zoom-in;
    box-shadow:0 0 0 1px rgba(243,237,228,.14),0 18px 40px -16px rgba(0,0,0,.95);will-change:transform,filter,opacity;opacity:0}
  .card img,.card video{width:100%;aspect-ratio:4/5;object-fit:cover;pointer-events:none}
  .card:focus-visible{outline:1px solid var(--gold-light);outline-offset:3px}
  #sun{position:absolute;left:50%;top:50%;z-index:40;width:var(--s,140px);height:var(--s,140px);transform:translate(-50%,-50%) scale(.4);
    border:0;background:none;padding:0;opacity:0;transition:transform 1.8s var(--ease),opacity 1.4s ease}
  #orbit.live #sun{transform:translate(-50%,-50%) scale(1);opacity:1}
  #orbit.leaving #sun{transform:translate(-50%,-50%) scale(1.5);opacity:0;transition:transform 1.2s var(--ease),opacity 1s ease .2s}
  #sun:focus-visible{outline:1px solid var(--gold-light);outline-offset:14px;border-radius:50%}
  .hint{position:absolute;left:0;right:0;bottom:calc(26px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--ivory-soft);z-index:45;
    opacity:0;transition:opacity 1.4s ease}
  #orbit.live .hint{opacity:1;transition-delay:2.6s;animation:breathe 3s ease-in-out 4s infinite}
  @keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}
  #orbit.leaving .hint{opacity:0;animation:none;transition-delay:0s}

  /* ---------------- 3 · the question ---------------- */
  .finale{position:fixed;inset:0;z-index:5;display:grid;place-items:center;overflow:hidden;isolation:isolate;
    opacity:0;visibility:hidden;transition:opacity 1.6s ease,visibility 1.6s ease}
  .finale.open{opacity:1;visibility:visible}
  .wall{position:absolute;inset:-18% -14%;display:flex;gap:12px;transform:rotate(-7deg);z-index:-3;
    filter:grayscale(.45) brightness(.5);transition:filter 2.4s ease}
  .col{flex:1;min-width:0;animation:wallUp var(--d,60s) linear infinite}
  .col.rev{animation-name:wallDown}
  .col img{width:100%;height:auto;margin-bottom:12px;border-radius:6px}
  @keyframes wallUp{from{transform:translateY(0)}to{transform:translateY(-50%)}}
  @keyframes wallDown{from{transform:translateY(-50%)}to{transform:translateY(0)}}
  .wall-shade{position:absolute;inset:0;z-index:-2;transition:opacity 2.4s ease;background:
    radial-gradient(ellipse 62% 58% at 50% 50%,rgba(11,10,9,.94) 0%,rgba(11,10,9,.84) 42%,rgba(11,10,9,.42) 100%),
    linear-gradient(180deg,var(--night) 0%,rgba(11,10,9,0) 18%,rgba(11,10,9,0) 82%,var(--night) 100%)}
  #dust{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}

  .fin{position:relative;text-align:center;padding:calc(40px + env(safe-area-inset-top,0px)) var(--gutter) calc(40px + env(safe-area-inset-bottom,0px));
    display:grid;justify-items:center;width:100%;max-height:100svh;overflow-y:auto}
  .fin > *{opacity:0;transform:translateY(18px);transition:opacity 1.3s ease,transform 1.3s var(--ease)}
  .finale.open .fin > *{opacity:1;transform:none}
  .finale.open .fin > :nth-child(1){transition-delay:.8s}
  .finale.open .fin > :nth-child(2){transition-delay:.4s}
  .finale.open .fin > :nth-child(3){transition-delay:1.6s}
  .finale.open .fin > :nth-child(4){transition-delay:2.1s}
  .finale.open .fin > :nth-child(5){transition-delay:3s}
  .fin-date{color:var(--gold);font-variant-numeric:tabular-nums}
  .fin .star{width:min(30vw,150px,20svh);height:min(30vw,150px,20svh);margin:42px 0 34px}

  .fin-name{font-family:var(--serif);font-style:italic;font-size:clamp(26px,6.4vw,36px);color:var(--ivory-soft);margin:18px 0 0}
  .fin-q{font-family:var(--serif);font-weight:400;font-size:clamp(46px,12.4vw,104px);line-height:.98;letter-spacing:-.03em;margin:4px 0 0;max-width:11ch;text-wrap:balance}
  .fin-q em{font-style:italic;color:var(--gold-light)}
  .actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:40px}
  .btn{border:0;border-radius:999px;padding:17px 34px;font-family:var(--sans);font-weight:600;font-size:15px;letter-spacing:.02em;
    transition:transform .3s var(--ease),box-shadow .3s ease}
  .btn.primary{background:var(--ivory);color:var(--night);box-shadow:0 18px 40px -18px rgba(243,237,228,.6)}
  .btn.primary:hover{transform:translateY(-2px)}
  .btn.ghost{background:transparent;color:var(--ivory);box-shadow:inset 0 0 0 1px rgba(243,237,228,.34)}
  .btn.ghost:hover{box-shadow:inset 0 0 0 1px rgba(243,237,228,.7)}
  .btn:active{transform:scale(.97)}
  .btn:focus-visible{outline:2px solid var(--gold);outline-offset:4px}

  .after{display:none;justify-items:center}
  .after h3{font-family:var(--serif);font-weight:400;font-size:clamp(52px,14vw,120px);line-height:.95;letter-spacing:-.03em;margin:18px 0 0}
  .after h3 em{font-style:italic;color:var(--gold-light)}
  .after p{font-family:var(--serif);font-style:italic;font-size:clamp(21px,5.2vw,28px);line-height:1.3;color:var(--ivory-soft);max-width:24ch;margin:22px 0 0}
  .after .sig{font-family:var(--sans);font-style:normal;font-size:12px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-top:30px}
  .finale.yes .fin-name,.finale.yes .fin-q,.finale.yes .actions{display:none}
  .finale.yes .after{display:grid}
  .finale.yes .after > *{animation:up 1.4s var(--ease) both}
  .finale.yes .after > :nth-child(2){animation-delay:.6s}
  .finale.yes .after > :nth-child(3){animation-delay:1.3s}
  @keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .finale.yes .wall{filter:grayscale(0) brightness(.82)}
  .finale.yes .wall-shade{opacity:.62}

  /* ---------------- viewer ---------------- */
  #viewer{position:fixed;inset:0;z-index:95;background:rgba(8,7,6,.97);display:none;grid-template-rows:auto 1fr auto;
    padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(16px + env(safe-area-inset-bottom,0px))}
  #viewer.open{display:grid;animation:fade .35s ease}
  @keyframes fade{from{opacity:0}}
  .v-top{display:flex;justify-content:space-between;align-items:center;color:var(--ivory-soft);padding:4px 6px}
  .v-stage{display:grid;place-items:center;min-height:0;padding:12px 0}
  .v-stage img,.v-stage video{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px;animation:fade .35s ease}
  .v-nav{display:flex;justify-content:center;gap:10px}
  .icon{width:46px;height:46px;border-radius:50%;border:0;background:rgba(243,237,228,.08);display:grid;place-items:center;color:var(--ivory)}
  .icon:hover{background:rgba(243,237,228,.16)}
  .icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition-duration:.01s!important}
  }
</style>
</head>
<body>

<canvas id="sky"></canvas>
<div class="glow"></div>

<!-- 1 · the moon -->
<div id="gate">
  <button class="moon-btn" id="moonBtn" aria-label="Entrar">
    <span class="moon-float"><span class="moon-halo"></span><span class="moon">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <defs>
          <!-- large soft "seas" -->
          <filter id="maria" x="0" y="0" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency=".011" numOctaves="4" seed="7"/>
            <feColorMatrix type="matrix" values="0 0 0 0 .42  0 0 0 0 .39  0 0 0 0 .34  1.9 0 0 0 -.78"/>
            <feGaussianBlur stdDeviation="1.4"/>
          </filter>
          <!-- fine surface grain -->
          <filter id="grain" x="0" y="0" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency=".09" numOctaves="3" seed="3"/>
            <feColorMatrix type="matrix" values="0 0 0 0 .3  0 0 0 0 .28  0 0 0 0 .25  1.2 0 0 0 -.5"/>
          </filter>
          <radialGradient id="mBase" cx="38%" cy="34%" r="70%">
            <stop offset="0" stop-color="#fffbf2"/><stop offset=".45" stop-color="#e9e0cf"/><stop offset="1" stop-color="#b9ad96"/>
          </radialGradient>
          <radialGradient id="mShade" cx="30%" cy="28%" r="85%">
            <stop offset=".45" stop-color="#0b0a09" stop-opacity="0"/><stop offset=".85" stop-color="#0b0a09" stop-opacity=".55"/><stop offset="1" stop-color="#0b0a09" stop-opacity=".8"/>
          </radialGradient>
          <radialGradient id="crater" cx="50%" cy="50%" r="50%">
            <stop offset="0" stop-color="#8d826e" stop-opacity=".45"/><stop offset=".7" stop-color="#8d826e" stop-opacity=".18"/><stop offset=".86" stop-color="#fffaf0" stop-opacity=".35"/><stop offset="1" stop-color="#fffaf0" stop-opacity="0"/>
          </radialGradient>
          <clipPath id="disc"><circle cx="100" cy="100" r="100"/></clipPath>
        </defs>
        <g clip-path="url(#disc)">
          <rect width="200" height="200" fill="url(#mBase)"/>
          <rect width="200" height="200" filter="url(#maria)" opacity=".85"/>
          <rect width="200" height="200" filter="url(#grain)" opacity=".35"/>
          <circle cx="132" cy="58" r="9" fill="url(#crater)"/>
          <circle cx="70" cy="138" r="13" fill="url(#crater)"/>
          <circle cx="146" cy="122" r="6" fill="url(#crater)"/>
          <circle cx="94" cy="44" r="5" fill="url(#crater)"/>
          <circle cx="112" cy="160" r="7" fill="url(#crater)"/>
          <rect width="200" height="200" fill="url(#mShade)"/>
        </g>
      </svg>
    </span></span>
  </button>
</div>

<!-- 2 · our photos around the star -->
<section id="orbit" aria-label="Nuestras fotos">
  <button id="sun" class="star" aria-label="Toca la estrella">
    <span class="aura"></span><span class="pulse"></span><span class="pulse p2"></span>
    <span class="flare"></span><span class="flare v"></span>
    <svg viewBox="0 0 200 200" aria-hidden="true"><use href="#starShape"/></svg>
  </button>
  <div class="hint eyebrow">toca la estrella</div>
</section>

<!-- 3 · the question -->
<section class="finale" id="finale" aria-label="Uma pergunta">
  <div class="wall" id="wall" aria-hidden="true"></div>
  <div class="wall-shade"></div>
  <canvas id="dust"></canvas>
  <div class="fin">
    <div class="eyebrow fin-date" id="finDate"></div>
    <div class="star" id="finStar" aria-hidden="true">
      <span class="aura"></span><span class="pulse"></span><span class="pulse p2"></span>
      <span class="flare"></span><span class="flare v"></span>
      <svg viewBox="0 0 200 200"><use href="#starShape"/></svg>
    </div>
    <p class="fin-name">Ashley,</p>
    <h2 class="fin-q">quer compartilhar uma <em>vida</em> comigo?</h2>
    <div class="actions">
      <button class="btn primary" data-yes>Sim</button>
      <button class="btn ghost" data-yes>Claro que sim</button>
    </div>
    <div class="after" aria-live="polite">
      <h3>Agora é <em>oficial.</em></h3>
      <p>Enquanto Deus permitir e você quiser, vou estar aqui — incondicionalmente.</p>
      <div class="sig">Te quiero mucho · Feli</div>
    </div>
  </div>
</section>

<!-- viewer -->
<div id="viewer" role="dialog" aria-modal="true" aria-label="Fotos">
  <div class="v-top"><span class="eyebrow" id="vCount"></span>
    <button class="icon" id="vClose" aria-label="Cerrar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="v-stage" id="vStage"></div>
  <div class="v-nav">
    <button class="icon" id="vPrev" aria-label="Anterior"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="icon" id="vNext" aria-label="Siguiente"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
</div>

<!-- the star shape, drawn once and reused -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="sg" cx="50%" cy="48%" r="55%">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".4" stop-color="#fff4d8"/><stop offset="1" stop-color="#e9c27a"/>
    </radialGradient>
    <g id="starShape">
      <path fill="url(#sg)" d="M100 4 C104 66 134 96 196 100 C134 104 104 134 100 196 C96 134 66 104 4 100 C66 96 96 66 100 4Z"/>
      <path fill="url(#sg)" opacity=".45" transform="rotate(45 100 100)" d="M100 40 C102 78 122 98 160 100 C122 102 102 122 100 160 C98 122 78 102 40 100 C78 98 98 78 100 40Z"/>
      <circle cx="100" cy="100" r="13" fill="#fff"/>
    </g>
  </defs>
</svg>

<script>
/* The day of the question. Change it here if it ends up being another day. */
const ASK_DATE = {d:25, m:10, y:2026};
document.getElementById('finDate').textContent =
  `${String(ASK_DATE.d).padStart(2,'0')} · ${String(ASK_DATE.m).padStart(2,'0')} · ${ASK_DATE.y}`;

/* photos around the star (vid: = short muted clip) */
const ORBIT = ['01-cancha','10-bus','05-noche','03-abrazo','vid:hoy','11-gafas','06-flores','13-sonrisa',
  '02-campeones','08-carro','vid:veinte','12-cerca','09-gorra','04-abrazo2','14-risa','16-cancha2'];
const WALL = ['01-cancha','05-noche','10-bus','03-abrazo','11-gafas','06-flores','13-sonrisa','02-campeones','08-carro',
  '12-cerca','09-gorra','15-hoy','04-abrazo2','14-risa','07-veinte','16-cancha2','18-bus2','17-campeones2'];
const POSTER = {hoy:'15-hoy', veinte:'07-veinte'};
const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
const $ = s => document.querySelector(s);

/* ================= 1 · moon ================= */
$('#moonBtn').addEventListener('click', ()=>{
  $('#gate').classList.add('done');
  setTimeout(startOrbit, 700);
}, {once:true});

/* ================= 2 · orbit ================= */
const orbit = $('#orbit'), sun = $('#sun');
const cards = ORBIT.map((key,k)=>{
  const b = document.createElement('button');
  b.className = 'card'; b.setAttribute('aria-label','Ver foto');
  let el;
  if(key.startsWith('vid:')){
    const n = key.slice(4);
    el = document.createElement('video');
    Object.assign(el, {src:`vid/${n}.mp4`, poster:`img/${POSTER[n]}.jpg`, muted:true, loop:true, playsInline:true, preload:'auto'});
    el.setAttribute('playsinline',''); el.setAttribute('muted','');
  } else {
    el = document.createElement('img'); el.src = `w/${key}.jpg`; el.alt = ''; el.decoding = 'async';
  }
  b.appendChild(el);
  b.addEventListener('click', ()=>openViewer(k));
  orbit.appendChild(b);
  return {el:b, media:el, key};
});
const INNER = 6;
cards.forEach((c,k)=>{
  const inner = k < INNER, n = inner ? INNER : cards.length - INNER, i = inner ? k : k - INNER;
  c.ring = inner ? 0 : 1;
  c.a = (i/n)*Math.PI*2 + (inner ? .25 : 0);
  c.tilt = ((k*37)%9) - 4;
});

let W, H, CW, rings, spread = 0, fade = 1, running = false, paused = false;
function layout(){
  W = innerWidth; H = innerHeight;
  const m = Math.min(W,H);
  const S = Math.round(Math.max(118, Math.min(190, m*.3)));
  CW = Math.round(Math.max(66, Math.min(132, W*.18, H*.13)));
  sun.style.setProperty('--s', S+'px');
  cards.forEach(c=>c.el.style.width = CW+'px');
  const maxRx = W/2 - CW*.62, maxRy = H/2 - CW*.75 - 54;
  rings = [
    {rx: Math.min(maxRx*.6, S*.5 + CW*1.05), ry: Math.min(maxRy*.56, S*.5 + CW*1.3), speed:.05},
    {rx: maxRx, ry: maxRy, speed:-.032}
  ];
}
addEventListener('resize', layout); layout();

function tween(from, to, ms, set, done){
  const t0 = performance.now();
  (function step(now){
    const t = Math.min(1, (now-t0)/ms), e = 1 - Math.pow(1-t, 3);
    set(from + (to-from)*e);
    if(t < 1) requestAnimationFrame(step); else if(done) done();
  })(t0);
}

function startOrbit(){
  orbit.classList.add('live');
  running = true;
  cards.forEach(c=>{ if(c.media.tagName==='VIDEO') c.media.play().catch(()=>{}); });
  requestAnimationFrame(tick);
  tween(0, 1, reduce ? 10 : 2400, v=>spread = v);
}

let last = performance.now();
function tick(now){
  const dt = Math.min(.05, (now-last)/1000); last = now;
  const cx = W/2, cy = H/2;
  for(const c of cards){
    const r = rings[c.ring];
    if(!paused && !reduce) c.a += r.speed*dt;
    const s = Math.sin(c.a), depth = (s+1)/2;           // 0 = far side, 1 = near side
    const sc = (.74 + depth*.34) * (.6 + .4*spread);
    const x = cx + Math.cos(c.a)*r.rx*spread - CW/2;
    const y = cy + s*r.ry*spread - CW*.625;
    c.el.style.transform = `translate3d(${x.toFixed(1)}px,${y.toFixed(1)}px,0) scale(${sc.toFixed(3)}) rotate(${c.tilt}deg)`;
    c.el.style.zIndex = Math.round(depth*30);            // the star sits above (40)
    c.el.style.filter = `brightness(${(.55+depth*.45).toFixed(2)}) blur(${((1-depth)*1.6).toFixed(2)}px)`;
    c.el.style.opacity = (Math.min(1, spread*1.6) * fade).toFixed(3);
  }
  if(running) requestAnimationFrame(tick);
}

/* ================= 3 · the question ================= */
const finale = $('#finale');
sun.addEventListener('click', ()=>{
  orbit.classList.add('leaving');
  tween(1, 2.3, 1400, v=>spread = v);
  tween(1, 0, 1100, v=>fade = v, ()=>{
    running = false;
    orbit.classList.add('gone');
    cards.forEach(c=>{ if(c.media.tagName==='VIDEO') c.media.pause(); });
  });
  setTimeout(()=>{ finale.classList.add('open'); startDust(); }, 700);
}, {once:true});

/* wall of photos behind the question */
const wall = $('#wall');
let wallCols = 0;
function buildWall(){
  const n = innerWidth < 720 ? 3 : innerWidth < 1200 ? 5 : 6;
  if(n === wallCols) return;
  wallCols = n; wall.replaceChildren();
  for(let c=0;c<n;c++){
    const col = document.createElement('div');
    col.className = 'col' + (c%2 ? ' rev' : '');
    col.style.setProperty('--d', (54 + (c*7)%20) + 's');
    const seq = Array.from({length:8}, (_,k)=>WALL[(c*5 + k*3) % WALL.length]);
    [...seq, ...seq].forEach(name=>{
      const im = document.createElement('img');
      im.src = `w/${name}.jpg`; im.alt = ''; im.decoding = 'async';
      col.appendChild(im);
    });
    wall.appendChild(col);
  }
}
buildWall(); addEventListener('resize', buildWall);

/* gold dust: a little always, a lot when she says yes */
const dcv = $('#dust'), dctx = dcv.getContext('2d');
let parts = [], DW = 0, DH = 0, said = false, dustOn = false;
function sizeDust(){ const d = Math.min(devicePixelRatio||1, 2); DW = innerWidth; DH = innerHeight; dcv.width = DW*d; dcv.height = DH*d; dctx.setTransform(d,0,0,d,0,0); }
addEventListener('resize', sizeDust); sizeDust();
function ember(burst){
  if(burst){
    const s = $('#finStar').getBoundingClientRect(), cx = s.left + s.width/2, cy = s.top + s.height/2;
    const a = Math.random()*Math.PI*2, v = 1.2 + Math.random()*5.5;
    return {b:true, x:cx, y:cy, vx:Math.cos(a)*v, vy:Math.sin(a)*v - 1, r:.6+Math.random()*2.2, life:1, decay:.004+Math.random()*.006, drag:.975,
      hue: Math.random()<.5 ? '243,223,174' : '243,237,228'};
  }
  return {x:Math.random()*DW, y:DH + 10, vx:(Math.random()-.5)*.25, vy:-(.25+Math.random()*.6), r:.5+Math.random()*1.4, life:1, decay:.0016+Math.random()*.002, drag:1,
    hue: Math.random()<.5 ? '243,223,174' : '243,237,228'};
}
function dustLoop(){
  dctx.clearRect(0,0,DW,DH);
  if(!reduce && parts.filter(p=>!p.b).length < (said ? 70 : 26) && Math.random() < .5) parts.push(ember(false));
  parts = parts.filter(p=>p.life>0);
  for(const p of parts){
    p.vx *= p.drag; p.vy *= p.drag; if(p.b) p.vy += .02;
    p.x += p.vx; p.y += p.vy; p.life -= p.decay;
    dctx.beginPath(); dctx.fillStyle = `rgba(${p.hue},${Math.max(0,Math.min(1,p.life))*(p.b?1:.7)})`; dctx.arc(p.x,p.y,p.r,0,7); dctx.fill();
  }
  requestAnimationFrame(dustLoop);
}
function startDust(){ if(dustOn) return; dustOn = true; requestAnimationFrame(dustLoop); }

document.querySelectorAll('[data-yes]').forEach(b=>b.addEventListener('click', ()=>{
  if(said) return;
  said = true;
  finale.classList.add('yes');
  if(navigator.vibrate) navigator.vibrate([30,60,30]);
  if(reduce) return;
  const wave = n => { for(let i=0;i<n;i++) parts.push(ember(true)); };
  wave(220); setTimeout(()=>wave(140), 700); setTimeout(()=>wave(100), 1500);
}));

/* ================= viewer ================= */
const viewer = $('#viewer'), stage = $('#vStage'), count = $('#vCount');
let vi = 0;
function show(i){
  vi = (i + cards.length) % cards.length;
  const key = cards[vi].key;
  let el;
  if(key.startsWith('vid:')){
    el = document.createElement('video');
    Object.assign(el, {src:`vid/${key.slice(4)}.mp4`, muted:true, loop:true, playsInline:true, autoplay:true});
    el.setAttribute('playsinline','');
  } else { el = document.createElement('img'); el.src = `img/${key}.jpg`; el.alt = ''; }
  stage.replaceChildren(el);
  count.textContent = `${String(vi+1).padStart(2,'0')} / ${String(cards.length).padStart(2,'0')}`;
}
function openViewer(i){ show(i); viewer.classList.add('open'); paused = true; }
function closeV(){ viewer.classList.remove('open'); stage.replaceChildren(); paused = false; }
$('#vClose').addEventListener('click', closeV);
$('#vPrev').addEventListener('click', ()=>show(vi-1));
$('#vNext').addEventListener('click', ()=>show(vi+1));
addEventListener('keydown', e=>{
  if(!viewer.classList.contains('open')) return;
  if(e.key==='Escape') closeV(); if(e.key==='ArrowLeft') show(vi-1); if(e.key==='ArrowRight') show(vi+1);
});
let tx = null;
stage.addEventListener('touchstart', e=>{ tx = e.touches[0].clientX; }, {passive:true});
stage.addEventListener('touchend', e=>{ if(tx===null) return; const dx = e.changedTouches[0].clientX - tx; if(Math.abs(dx)>45) show(vi + (dx<0?1:-1)); tx = null; });
stage.addEventListener('click', e=>{ if(e.target===stage) closeV(); });

/* ================= quiet starfield behind everything ================= */
const cv = $('#sky'), ctx = cv.getContext('2d');
let stars = [], SW, SH, DPR;
function resizeSky(){
  DPR = Math.min(devicePixelRatio||1, 2);
  SW = cv.width = innerWidth*DPR; SH = cv.height = innerHeight*DPR;
  stars = Array.from({length: Math.round(innerWidth*innerHeight/5000)}, ()=>({
    x:Math.random()*SW, y:Math.random()*SH, r:(Math.random()*.9+.2)*DPR, b:Math.random()*.4+.15, t:Math.random()*7, sp:Math.random()*.0015+.0004}));
}
function sky(t){
  ctx.clearRect(0,0,SW,SH); ctx.fillStyle = '#f3ede4';
  for(const s of stars){
    ctx.globalAlpha = reduce ? s.b : Math.max(0, Math.min(1, s.b + .3*Math.sin(t*s.sp + s.t)));
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(sky);
}
addEventListener('resize', resizeSky); resizeSky(); requestAnimationFrame(sky);
</script>
</body>
