<title>Para Ashley 🤍</title>
<style>
  :root{
    --black:#000000;
    --ink:#f5f5f7;
    --ink-soft:#b7b8c2;
    --ink-faint:#77788a;
    --line:rgba(255,255,255,.12);
    --card:rgba(255,255,255,.04);
    --serif:ui-serif,"Iowan Old Style","Palatino Linotype","Palatino",Georgia,"Times New Roman",serif;
    --round:ui-rounded,-apple-system,"SF Pro Rounded","Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    background:var(--black);
    color:var(--ink);
    font-family:var(--serif);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  a{color:inherit}
  button{font-family:inherit}

  /* ---- Fixed starfield canvas, pure black ---- */
  #sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block;background:#000}

  /* ---- Intro gate ---- */
  #gate{
    position:fixed;inset:0;z-index:80;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:32px;background:#000;
    transition:opacity 1s ease, visibility 1s ease;
  }
  #gate.hidden{opacity:0;visibility:hidden;pointer-events:none}
  .gate-heart{font-size:32px;filter:drop-shadow(0 0 14px rgba(255,255,255,.45));margin-bottom:24px;
    animation:beat 3.2s ease-in-out infinite}
  @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
  .gate-line{
    font-family:var(--serif);font-size:clamp(26px,7vw,42px);font-weight:500;font-style:italic;
    letter-spacing:.2px;line-height:1.3;color:var(--ink);text-wrap:balance;max-width:16ch;
  }
  .gate-line .gh{font-style:normal}
  .enter-btn{
    margin-top:46px;font-family:var(--round);font-size:14.5px;letter-spacing:.02em;
    color:#000;background:#fff;border:none;border-radius:100px;padding:15px 28px;cursor:pointer;
    box-shadow:0 0 0 1px rgba(255,255,255,.3),0 16px 40px -14px rgba(255,255,255,.5);
    transition:transform .25s ease, box-shadow .25s ease;
  }
  .enter-btn:hover{transform:translateY(-2px)}
  .enter-btn:focus-visible{outline:2px solid #fff;outline-offset:3px}

  /* ---- Space hero (interactive) ---- */
  #space{position:relative;z-index:10;height:100svh;min-height:560px;overflow:hidden}
  .space-label{position:absolute;top:34px;left:0;right:0;text-align:center;z-index:5;pointer-events:none}
  .space-label .k{font-family:var(--round);font-size:11px;letter-spacing:.36em;text-transform:uppercase;color:var(--ink-faint)}
  .space-label .t{font-family:var(--serif);font-style:italic;font-size:clamp(22px,5vw,30px);margin-top:8px;color:var(--ink)}
  .scroll-cue{position:absolute;bottom:26px;left:0;right:0;text-align:center;z-index:5;
    font-family:var(--round);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-faint);
    display:flex;flex-direction:column;align-items:center;gap:8px}
  .scroll-cue::after{content:"";width:1px;height:26px;background:linear-gradient(var(--ink-faint),transparent)}

  /* Planets: absolutely positioned inside #space, % based */
  .planet{position:absolute;transform:translate(-50%,-50%);cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:none;padding:0;
    animation:bob 7s ease-in-out infinite}
  .planet:nth-child(odd){animation-duration:8.5s}
  @keyframes bob{0%,100%{margin-top:0}50%{margin-top:-14px}}
  .orb{border-radius:50%;position:relative}
  .orb::after{content:"";position:absolute;inset:0;border-radius:50%;
    box-shadow:inset -10px -12px 22px rgba(0,0,0,.55), inset 6px 6px 14px rgba(255,255,255,.12)}
  .planet .pname{font-family:var(--round);font-size:11px;letter-spacing:.1em;color:var(--ink-soft);
    opacity:0;transform:translateY(-2px);transition:opacity .25s ease, transform .25s ease;white-space:nowrap}
  .planet:hover .pname,.planet:focus-visible .pname{opacity:1;transform:translateY(0)}
  .planet:focus-visible{outline:2px solid #fff;outline-offset:6px;border-radius:50%}

  .planet-hulk .orb{width:74px;height:74px;
    background:radial-gradient(circle at 35% 30%,#8fe3a6 0%,#3f9e5e 45%,#1f5c37 78%,#0d331d 100%);
    box-shadow:0 0 30px 4px rgba(83,214,132,.28)}
  .planet-photo .orb{width:64px;height:64px;overflow:hidden;
    background:radial-gradient(circle at 35% 30%,#4a4f7a 0%,#2b2f52 45%,#181b34 78%,#0a0b1a 100%);
    box-shadow:0 0 26px 3px rgba(150,160,220,.22)}
  .planet-photo .orb img{width:100%;height:100%;object-fit:cover;display:block}
  .planet-ring .orb{width:52px;height:52px;
    background:radial-gradient(circle at 35% 30%,#e8b98a 0%,#b8793f 45%,#6e441f 78%,#331f0d 100%);
    box-shadow:0 0 24px 3px rgba(232,185,138,.22)}
  .planet-ring::before{content:"";position:absolute;width:88px;height:24px;left:50%;top:50%;
    transform:translate(-50%,-50%) rotate(-18deg);border:2px solid rgba(232,185,138,.4);
    border-radius:50%;pointer-events:none}

  /* Bright stars = songs */
  .starbtn{position:absolute;transform:translate(-50%,-50%);background:none;border:none;padding:0;
    cursor:pointer;width:64px;height:64px;display:grid;place-items:center}
  .starbtn:focus-visible{outline:2px solid #fff;outline-offset:4px;border-radius:50%}
  .starbtn svg{filter:drop-shadow(0 0 10px rgba(255,255,255,.8))}
  .starbtn .sname{position:absolute;top:70%;left:50%;transform:translateX(-50%);
    font-family:var(--round);font-size:11px;letter-spacing:.08em;color:var(--ink-soft);
    white-space:nowrap;opacity:0;transition:opacity .25s ease}
  .starbtn:hover .sname,.starbtn:focus-visible .sname{opacity:1}

  /* ---- Content below ---- */
  main{position:relative;z-index:10;max-width:640px;margin:0 auto;padding:0 22px 90px}
  main section{padding:56px 0;opacity:0;transform:translateY(24px);
    transition:opacity 1s ease, transform 1s ease}
  main section.in{opacity:1;transform:none}

  .eyebrow{font-family:var(--round);font-size:11px;letter-spacing:.32em;text-transform:uppercase;
    color:var(--ink-faint);margin:0 0 14px}
  h2{font-family:var(--serif);font-weight:500;font-size:clamp(24px,6vw,34px);line-height:1.14;
    margin:0 0 16px;text-wrap:balance}
  p{font-size:clamp(15.5px,4vw,17px);line-height:1.72;color:var(--ink-soft);margin:0 0 14px;max-width:58ch}

  .moon-card,.num-card{border:1px solid var(--line);border-radius:18px;padding:26px 24px;background:var(--card)}
  .moon-fig{display:flex;align-items:center;gap:20px;margin-bottom:16px}
  .moon-orb{flex:0 0 auto;width:56px;height:56px;border-radius:50%;
    background:radial-gradient(circle at 38% 34%,#f4ecd6 0%,#d9cfae 46%,#a99f78 100%);
    box-shadow:0 0 28px 4px rgba(244,236,214,.25)}
  .moon-meta .k{font-family:var(--round);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-faint)}
  .moon-meta .v{font-family:var(--serif);font-style:italic;font-size:19px;color:var(--ink);margin-top:2px}

  .num-big{font-family:var(--round);font-variant-numeric:tabular-nums;font-weight:600;
    font-size:clamp(52px,16vw,88px);letter-spacing:.04em;line-height:1;color:#fff;
    text-align:center;margin:4px 0}
  .num-time{text-align:center;font-family:var(--round);font-size:12px;letter-spacing:.3em;
    text-transform:uppercase;color:var(--ink-faint);margin-bottom:18px}
  .secret{font-style:italic;color:#fff}

  .count{display:flex;align-items:baseline;justify-content:center;gap:14px;margin:6px 0 4px}
  .count .n{font-family:var(--round);font-weight:600;font-size:clamp(44px,14vw,80px);color:#fff;line-height:1}
  .count .l{font-family:var(--serif);font-style:italic;font-size:22px;color:var(--ink-soft)}

  .letter{border:1px solid var(--line);border-radius:20px;padding:30px 26px;background:var(--card)}
  .letter .greet{font-family:var(--serif);font-style:italic;font-size:22px;color:var(--ink);margin:0 0 16px}
  .letter p{font-size:16px;line-height:1.8;color:#d7d8e2}
  .letter .sign{font-family:var(--serif);font-style:italic;font-size:19px;color:var(--ink);margin-top:20px}

  footer{text-align:center;padding:60px 0 20px;position:relative;z-index:10}
  footer .fh{font-size:24px;filter:drop-shadow(0 0 12px rgba(255,255,255,.5))}
  footer .ft{font-family:var(--serif);font-style:italic;color:var(--ink-soft);margin-top:12px;font-size:17px}

  /* Modals (song / planet / photo) */
  .modal{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;
    padding:24px;background:rgba(0,0,0,.78)}
  .modal.open{display:flex;animation:fade .3s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal-card{max-width:380px;width:100%;border:1px solid rgba(255,255,255,.16);border-radius:20px;
    padding:28px 24px;text-align:center;background:#0a0a0d;box-shadow:0 40px 100px -30px rgba(0,0,0,.9)}
  .modal-card h3{font-family:var(--serif);font-style:italic;font-size:24px;margin:0 0 4px;color:#fff}
  .modal-card .artist{font-family:var(--round);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:14px}
  .modal-card .why{font-size:14.5px;line-height:1.6;color:var(--ink-soft);margin:0 0 22px}
  .modal-card .play{display:inline-flex;align-items:center;gap:8px;font-family:var(--round);font-size:13.5px;
    color:#000;background:#fff;border-radius:100px;padding:12px 22px;text-decoration:none}
  .modal-close{margin-top:16px;background:none;border:none;color:var(--ink-faint);
    font-family:var(--round);font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer}
  .modal-close:focus-visible,.modal-card .play:focus-visible{outline:2px solid #fff;outline-offset:3px}
  .planet-modal-card{max-width:300px}
  .photo-modal-card{max-width:230px;padding:10px}
  .photo-modal-card img{width:100%;height:auto;max-height:74vh;object-fit:contain;border-radius:10px;display:block}
  .photo-modal-card .cap{font-family:var(--round);font-size:12px;color:var(--ink-faint);margin-top:12px}

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important}
    section{opacity:1;transform:none}
    html{scroll-behavior:auto}
  }
</style>

<canvas id="sky"></canvas>

<!-- Intro gate -->
<div id="gate">
  <div class="gate-heart">🤍</div>
  <div class="gate-line">hope is not that much <span class="gh">🤍</span></div>
  <button class="enter-btn" id="enterBtn">Igual me vale pija</button>
</div>

<!-- Interactive space -->
<section id="space" aria-label="Nuestro espacio">
  <!-- planets and stars injected by JS -->
</section>

<!-- Planet modal (decorative) -->
<div class="modal" id="planetModal" role="dialog" aria-modal="true" aria-label="Planeta">
  <div class="modal-card planet-modal-card">
    <h3>Planeta de Hulk 💚</h3>
    <div><button class="modal-close" data-close>Cerrar</button></div>
  </div>
</div>

<!-- Photo modal -->
<div class="modal" id="photoModal" role="dialog" aria-modal="true" aria-label="Foto">
  <div class="modal-card photo-modal-card">
    <img id="pImg" src="" alt="Ashley y Feli">
    <div class="cap" id="pCap"></div>
    <div><button class="modal-close" data-close>Cerrar</button></div>
  </div>
</div>

/* ================= BUILD SPACE SCENE (DOM) ================= */
const space = document.getElementById('space');

function starSVG(size, bright){
  const c = bright ? "#ffffff" : "#eef0ff";
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24">
    <path d="M12 2l2.6 6.3L21 9l-4.8 4.2L17.6 20 12 16.4 6.4 20l1.4-6.8L3 9l6.4-.7z" fill="${c}"/>
  </svg>`;
}

const starPositions = [
  {x:28,y:26,big:true},   // Si me preguntaran — brightest
  {x:62,y:20},
  {x:48,y:44}
];
SONGS.forEach((s,i)=>{
  const pos = starPositions[i];
  const a = document.createElement('a');
  a.className = 'starbtn';
  a.href = s.url; a.target = '_blank'; a.rel = 'noopener';
  a.style.left = pos.x+'%'; a.style.top = pos.y+'%';
  a.setAttribute('aria-label', 'Abrir canción en Apple Music');
  a.innerHTML = starSVG(pos.big?36:24, pos.big);
  space.appendChild(a);
});

  orb.className = 'orb';
  if(pl.size){ orb.style.width = pl.size+'px'; orb.style.height = pl.size+'px'; }
  if(pl.grad){ orb.style.background = pl.grad; if(pl.glow) orb.style.boxShadow = '0 0 26px 3px '+pl.glow; }
  btn.appendChild(orb);
  btn.addEventListener('click', ()=>{
    if(pl.action) return pl.action();
    if(pl.key) openPhoto(pl.key);
  });
  space.appendChild(btn);
});

/* ================= MODALS ================= */
function openModal(id){ document.getElementById(id).classList.add('open'); }
function closeModal(id){ document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('[data-close]').forEach(b=>{
  b.addEventListener('click', ()=>b.closest('.modal').classList.remove('open'));
});
document.querySelectorAll('.modal').forEach(m=>{
  m.addEventListener('click', e=>{ if(e.target===m) m.classList.remove('open'); });
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape') document.querySelectorAll('.modal.open').forEach(m=>m.classList.remove('open'));
});

function openPhoto(key){
  const src = PHOTOS[key];
  const img = document.getElementById('pImg');
  const cap = document.getElementById('pCap');
  img.src = src || "";
  img.style.display = src ? 'block' : 'none';
  cap.textContent = src ? "" : "foto pendiente 🤍";
  cap.style.display = src ? 'none' : 'block';
  openModal('photoModal');
}

/* Intro gate */
const gate = document.getElementById('gate');
document.getElementById('enterBtn').addEventListener('click', ()=>{
  gate.classList.add('hidden');
  setTimeout(()=>{ gate.style.display='none'; }, 1000);
});

/* Reveal on scroll */
const io = new IntersectionObserver(ents=>{
  ents.forEach(en=>{ if(en.isIntersecting) en.target.classList.add('in'); });
}, {threshold:.16});
document.querySelectorAll('main section').forEach(s=>io.observe(s));

/* ================= STARFIELD (ambient, pure black bg) ================= */
const cv = document.getElementById('sky'), ctx = cv.getContext('2d');
let W,H,DPR,stars=[],shooting=null;
const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
function resize(){
  DPR = Math.min(devicePixelRatio||1, 2);
  W = cv.width = innerWidth*DPR; H = cv.height = innerHeight*DPR;
  cv.style.width = innerWidth+'px'; cv.style.height = innerHeight+'px';
  build();
}
function build(){
  stars = [];
  const n = Math.round((innerWidth*innerHeight)/5200);
  for(let i=0;i<n;i++){
    stars.push({x:Math.random()*W, y:Math.random()*H, r:(Math.random()*1.1+.25)*DPR,
      base:Math.random()*.45+.25, tw:Math.random()*Math.PI*2, sp:Math.random()*.02+.006});
  }
}
function frame(t){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = '#fff';
  for(const s of stars){
    const a = reduce ? s.base : (s.base + .4*Math.sin(t*s.sp+s.tw));
    ctx.globalAlpha = Math.max(0, Math.min(1,a));
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  if(!reduce){
    if(!shooting && Math.random()<.0025){
      shooting = {x:Math.random()*W*.6, y:Math.random()*H*.3, vx:(6+Math.random()*4)*DPR, vy:(2.2+Math.random()*2)*DPR, life:1};
    }
    if(shooting){
      shooting.x += shooting.vx; shooting.y += shooting.vy; shooting.life -= .012;
      const len = 90*DPR;
      const gr = ctx.createLinearGradient(shooting.x, shooting.y, shooting.x-len, shooting.y-len*.4);
      gr.addColorStop(0, 'rgba(255,255,255,'+Math.max(0,shooting.life)+')');
      gr.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.strokeStyle = gr; ctx.lineWidth = 1.5*DPR;
      ctx.beginPath(); ctx.moveTo(shooting.x, shooting.y); ctx.lineTo(shooting.x-len, shooting.y-len*.4); ctx.stroke();
      if(shooting.life<=0 || shooting.x>W) shooting=null;
    }
  }
  requestAnimationFrame(frame);
}
addEventListener('resize', resize);
resize(); requestAnimationFrame(frame);
</script>
